name: extensions_plus
description: "This package provides a powerful collection of extensions for Dart's core types, enabling cleaner and more expressive code."
version: 1.6.0
homepage: "https://github.com/azharbinanwar/extensions_plus"

environment:
  sdk: ^3.8.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# WASM compatibility - this package uses only WASM-compatible libraries
# No usage of dart:html, dart:js, or other non-WASM libraries
topics:
  - extensions
  - utilities
  - dart
  - flutter
  - helper-functions
  - productivity
  - wasm-ready

flutter:
